<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unique Random Integer Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1.25rem;
      background: #f8fafc;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 1.25rem;
      text-align: center;
      color: #1f2937;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    label {
      font-size: 1rem;
      color: #374151;
      margin-bottom: 0.25rem;
      display: block;
    }

    input[type="number"] {
      width: 100%;
      padding: 0.75rem;
      font-size: 1.25rem;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 1rem;
      font-size: 1.25rem;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      margin-top: 0.75rem;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .result {
      margin-top: 2rem;
      text-align: center;
      font-size: 5.5rem;   /* VERY large for phones */
      font-weight: 800;
      color: #111827;
      line-height: 1;
    }

    .message {
      margin-top: 1rem;
      text-align: center;
      color: #374151;
      font-size: 1.05rem;
    }

    .footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.95rem;
      color: #6b7280;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.6rem;
      }

      .result {
        font-size: 4.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Unique Random Number</h1>

    <div class="inputs">
      <div>
        <label for="min">Minimum</label>
        <input type="number" id="min" value="1" />
      </div>
      <div>
        <label for="max">Maximum</label>
        <input type="number" id="max" value="10" />
      </div>
    </div>

    <button id="startBtn" style="background:#003057">
      Start / Reset
    </button>
    <button id="nextBtn" disabled style="background:#235C35">
      Get Next Number
    </button>
    
    <div class="result" id="result"></div>
    <div class="message" id="message"></div>

    <div class="footer">
      Highlands Teachers Quorum
    </div>
  </div>

  <script>
    let availableNumbers = [];

    const minInput = document.getElementById('min');
    const maxInput = document.getElementById('max');
    const startBtn = document.getElementById('startBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resultDiv = document.getElementById('result');
    const messageDiv = document.getElementById('message');

    function gentleVibrate(duration = 25) {
      if (navigator.vibrate) {
        navigator.vibrate(duration);
      }
    }

    function initializeNumbers() {
      const min = parseInt(minInput.value, 10);
      const max = parseInt(maxInput.value, 10);

      resultDiv.textContent = '';
      messageDiv.textContent = '';

      if (isNaN(min) || isNaN(max) || min > max) {
        messageDiv.textContent = 'Please enter a valid minimum and maximum.';
        nextBtn.disabled = true;
        return;
      }

      availableNumbers = [];
      for (let i = min; i <= max; i++) {
        availableNumbers.push(i);
      }

      nextBtn.disabled = false;
      gentleVibrate(15); // subtle confirmation
    }

    function getNextNumber() {
      if (availableNumbers.length === 0) {
        resultDiv.textContent = '';
        messageDiv.textContent = 'No more unique numbers available.';
        nextBtn.disabled = true;
        gentleVibrate(40); // slightly longer to signal completion
        return;
      }

      const randomIndex = Math.floor(Math.random() * availableNumbers.length);
      const number = availableNumbers.splice(randomIndex, 1)[0];

      resultDiv.textContent = number;
      messageDiv.textContent = `${availableNumbers.length} number(s) remaining.`;
      gentleVibrate(25); // gentle haptic on each draw
    }

    startBtn.addEventListener('click', initializeNumbers);
    nextBtn.addEventListener('click', getNextNumber);
  </script>
</body>
</html>
